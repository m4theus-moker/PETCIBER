<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Mapa de Bem-estar PETCIBER</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mapa.css') }}">
    <style>
        #map {
            height: 80vh;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        .leaflet-popup-content-wrapper {
            font-family: 'Segoe UI', sans-serif;
        }
        .logo-mapa {
            height: 50px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark" style="background-color: #8d4a27;">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <img src="{{ url_for('static', filename='logo.png') }}" class="logo-mapa me-2"> PETCIBER Mapa
            </a>
        </div>
    </nav>

    <div class="container my-4">
        <h2 class="text-center mb-4"><i class="fas fa-map-marker-alt"></i> Bem-estar Animal por Região</h2>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([-23.55, -46.63], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        const regioes = {{ regioes | tojson }};

        regioes.forEach(regiao => {
            let cor = "#28a745"; // Verde
            if (regiao.emocao === "Agitado") cor = "#ffc107"; // Amarelo
            if (regiao.emocao === "Estressado") cor = "#dc3545"; // Vermelho

            L.circle([regiao.lat, regiao.lng], {
                color: cor,
                fillColor: cor,
                fillOpacity: 0.5,
                radius: 800
            }).addTo(map)
              .bindPopup(`<strong>${regiao.nome}</strong><br>BPM médio: ${regiao.media_bpm}<br>Emoção: ${regiao.emocao}`);
        });
    </script>
</body>
</html>
