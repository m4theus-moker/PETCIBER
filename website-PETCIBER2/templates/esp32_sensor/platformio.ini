[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Porta/velocidades (ajuste COM4 se quiser fixar)
; upload_port = COM4
; monitor_port = COM4
upload_speed = 921600
monitor_speed = 115200
monitor_filters = time

; Dependências
lib_deps =
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
  adafruit/Adafruit MLX90614 Library @ ^2.1.3
  ; MPU opcional: habilite o define abaixo e instale as libs a seguir:
  ; adafruit/Adafruit MPU6050 @ ^2.2.6
  ; adafruit/Adafruit Unified Sensor @ ^1.1.14

; Mantém o MPU6050 desativado por padrão (evita erro se a lib não estiver instalada)
build_flags = -DUSE_MPU6050=0