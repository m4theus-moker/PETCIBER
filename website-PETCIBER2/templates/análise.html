<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Análise Comportamental</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #fdf6f0;
            font-family: 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 600px;
            margin-top: 40px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: #6d4c41;
        }
    </style>
</head>
<body>

{% include 'navbar.html' %}

<div class="container">
    <h2 class="text-center mb-4">Análise Comportamental do Pet</h2>
    <form method="post">
        <div class="mb-3">
            <label class="form-label">Batimentos cardíacos (bpm):</label>
            <input type="number" class="form-control" name="bpm" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Temperatura corporal (°C):</label>
            <input type="number" step="0.1" class="form-control" name="temp_corporal" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Temperatura ambiente (°C):</label>
            <input type="number" step="0.1" class="form-control" name="temp_ambiente" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Nível de atividade:</label>
            <select class="form-select" name="atividade" required>
                <option value="baixa">Baixa</option>
                <option value="moderada">Moderada</option>
                <option value="alta">Alta</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success w-100">Analisar</button>
    </form>

    {% if resultado %}
    <div class="alert alert-info mt-4">
        <strong>Estado emocional:</strong> {{ resultado }}
    </div>
    {% endif %}
</div>

</body>
</html>
